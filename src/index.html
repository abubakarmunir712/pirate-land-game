<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Land</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="rotate-device">Please rotate your device to landscape mode.</div>
    <div id="gameOverlay" class="overlay">
        <div class="overlay-content">
            <h1>Pirate Land</h1>
            <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="15">
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h1>Game Over!</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <div id="game-container">
        <div id="gameUI">
            <div id="playerNameDisplay">Player: <span id="playerName"></span></div>
            <div id="timerDisplay">Time: <span id="timer">60</span></div>
            <div id="scoreDisplay">Score: <span id="score">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <button id="fullscreen-btn">Fullscreen</button>
        <div id="controls">
            <div id="left-controls">
                <button id="up">▲</button>
                <button id="down">▼</button>
            </div>
            <div id="right-controls">
                <button id="left">◀</button>
                <button id="right">▶</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
